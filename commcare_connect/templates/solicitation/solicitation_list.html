{% extends "base.html" %}
{% load i18n %}
{% load render_table from django_tables2 %}
{% block content %}
  <div class="flex flex-col gap-4 w-full">
    <div class="flex justify-between items-center">
      <h1 class="title">{% translate "Solicitations" %}</h1>
      <a class="button button-md primary-dark"
         href="{% url "solicitation:create" request.org.slug %}">{% translate "New solicitation" %}</a>
    </div>
    <div class="w-full rounded-lg shadow-xs">{% render_table table %}</div>
  </div>
{% endblock content %}
