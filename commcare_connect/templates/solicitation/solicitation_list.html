{% extends "base.html" %}
{% load i18n %}
{% load render_table from django_tables2 %}
{% block content %}
  <div class="flex flex-col gap-2 w-full">
    <div class="flex relative mx-auto items-center justify-between w-full px-4 bg-slate-50 rounded-lg shadow-sm h-14">
      <h1 class="text-sm text-brand-deep-purple">{% translate "Solicitations" %}</h1>
      <a class="button button-md primary-dark"
         href="{% url "solicitation:create" request.org.slug %}">{% translate "New solicitation" %}</a>
    </div>
    <div class="w-full rounded-lg shadow-xs">{% render_table table %}</div>
  </div>
{% endblock content %}
