{% load i18n %}
{% translate "Show building footprints for the current view. Data from Overture Maps." as buildings_hint %}
<div x-show="buildingsAvailable"
     x-transition.opacity
     x-cloak
     class="absolute top-4 right-4 z-30 flex items-center gap-3 rounded-lg bg-white px-3 py-2 shadow-md">
  <label for="show-buildings-toggle" class="text-sm font-medium text-gray-900">
    {% translate "Show Building Data" %}
    <i class="fa-solid fa-spinner fa-spin text-gray-500"
       x-show="buildingsLoading"
       x-cloak></i>
  </label>
  <span x-tooltip.raw="{{ buildings_hint|escapejs }}">
    <input id="show-buildings-toggle"
           type="checkbox"
           class="simple-toggle"
           x-model="showBuildings"
           :disabled="buildingsLoading">
  </span>
</div>
