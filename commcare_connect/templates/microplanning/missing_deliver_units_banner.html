{% load i18n %}
{% if quoted_missing_deliver_units %}
  <div role="alert"
       class="flex items-start gap-3 p-4 bg-yellow-50 border border-yellow-300 text-yellow-800 rounded-md mb-6">
    <i class="fa-solid fa-triangle-exclamation text-xl" aria-hidden="true"></i>
    <p class="text-sm">
      {% blocktranslate with units=quoted_missing_deliver_units %}
        This opportunity's deliver app is missing deliver unit IDs: {{ units }}. Metrics for these units will show as zero.
      {% endblocktranslate %}
    </p>
  </div>
{% endif %}
