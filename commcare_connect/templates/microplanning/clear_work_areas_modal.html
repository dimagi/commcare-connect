{% load i18n %}
<div id="clear-work-areas-modal"
     class="modal-backdrop"
     x-cloak
     x-show="showClearWorkAreasModal"
     @click.self="showClearWorkAreasModal = false"
     @keydown.escape.window="showClearWorkAreasModal = false">
  <div class="modal" @click.stop>
    <h3 class="text-lg font-semibold mb-3">{% translate "Clear Work Areas" %}</h3>
    <p class="text-sm mb-4">
      {% translate "This will permanently delete all Work Areas and Work Area Groups for this opportunity so a new file can be uploaded. This action cannot be undone. Are you sure you want to continue?" %}
    </p>
    <div class="flex gap-2 justify-between">
      <button type="button"
              class="button button-md outline-style"
              @click="showClearWorkAreasModal = false">{% translate "Cancel" %}</button>
      <button type="button"
              class="button button-md negative-dark"
              hx-post="{% url 'microplanning:clear_work_areas' request.org.slug request.opportunity.opportunity_id %}"
              hx-swap="none">{% translate "Clear Work Areas" %}</button>
    </div>
  </div>
</div>
