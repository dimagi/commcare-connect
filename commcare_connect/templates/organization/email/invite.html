{% extends "email/base.html" %}
{% block content %}
  <p>Hi,</p>
  <p>
    {{ inviter }} has invited you to join "{{ invite.organization.name }}" on Connect as
    {{ invite.get_role_display }}.
  </p>
  <p>
    <a href="{{ invite_url }}">Accept the invitation</a>. This invite expires on {{ invite.expiry_date|date:"F j, Y H:i T" }}.
  </p>
{% endblock %}
