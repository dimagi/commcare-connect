{% if record.role == "admin" %}
  <span class="badge badge-sm badge-amber">{{ record.get_role_display }}</span>
{% elif record.role == "member" %}
  <span class="badge badge-sm positive-light">{{ record.get_role_display }}</span>
{% else %}
  <span class="badge badge-sm label">{{ record.get_role_display }}</span>
{% endif %}
