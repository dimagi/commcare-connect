{% load i18n %}
<div class="flex gap-2 justify-end">
  <button type="button"
          class="button button-sm outline-style"
          hx-post="{% url 'organization:resend_invite' record.organization.slug record.pk %}"
          hx-target="#pending_invites_container"
          hx-swap="innerHTML"
          {% if record.is_in_resend_cooldown %}disabled{% endif %}>
    {% if record.is_in_resend_cooldown %}
      {% translate "Just sent" %}
    {% else %}
      {% translate "Resend" %}
    {% endif %}
  </button>
  <button type="button"
          class="button button-sm outline-style text-red-600"
          hx-post="{% url 'organization:revoke_invite' record.organization.slug record.pk %}"
          hx-target="#pending_invites_container"
          hx-swap="innerHTML">{% translate "Revoke" %}</button>
</div>
