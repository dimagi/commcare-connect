{% load i18n %}
{# H025: Alpine.js requires <template x-if> as a fragment container; djlint incorrectly flags it as an orphan tag #}
{# djlint:off H025 #}
<template x-if="modalUrl">
  {# djlint:on #}
  {# x-if remounts on every open, fetching a fresh Add or Edit form from modalUrl. #}
  <div x-transition.opacity
       class="modal-backdrop"
       role="dialog"
       aria-modal="true"
       aria-labelledby="managed-option-modal-title"
       @keydown.escape.window="modalUrl = null">
    <div @click.outside="modalUrl = null"
         class="modal"
         x-init="htmx.ajax('GET', modalUrl, { target: $el, swap: 'innerHTML' })">
      <p class="hint">{% translate "Loading…" %}</p>
    </div>
  </div>
</template>
