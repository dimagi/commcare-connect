{% load i18n %}
{# H025: Alpine.js requires <template x-if> as a fragment container; djlint incorrectly flags it as an orphan tag #}
{# djlint:off H025 #}
<template x-if="sectorModalUrl">
  {# djlint:on #}
  {# x-if remounts on every open, fetching a fresh Add or Edit form from sectorModalUrl. #}
  <div x-transition.opacity
       class="modal-backdrop"
       role="dialog"
       aria-modal="true"
       aria-labelledby="primary-sector-modal-title"
       @keydown.escape.window="sectorModalUrl = null">
    <div @click.outside="sectorModalUrl = null"
         class="modal"
         x-init="htmx.ajax('GET', sectorModalUrl, { target: $el, swap: 'innerHTML' })">
      <p class="hint">{% translate "Loading…" %}</p>
    </div>
  </div>
</template>
