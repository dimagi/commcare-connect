exclude: '^docs/|/migrations/'
default_stages: [commit]
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key

  # Archived; prettier is pinned at v3.1.0 until the hook moves elsewhere
  - repo: https://github.com/pre-commit/mirrors-prettier # zizmor: ignore[archived-uses]
    rev: v3.1.0
    hooks:
      - id: prettier
        args: ['--tab-width', '2', '--single-quote']
        exclude: '(commcare_connect|\.claude/skills/ui-demo/server)/templates/'

  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.53.0
    hooks:
      - id: djlint-reformat-django
        exclude: commcare_connect/templates/prelogin/(home|in-action)\.html
      - id: djlint-django
        exclude: commcare_connect/templates/prelogin/(home|in-action)\.html

  - repo: https://github.com/adamchainz/django-upgrade
    rev: '1.32.0'
    hooks:
      - id: django-upgrade
        args: ['--target-version', '5.2']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.15.0
    hooks:
      - id: eslint
        files: commcare_connect/static/.*\.[jt]s$
        types: [file]
        types_or: [javascript, ts]
        exclude: commcare_connect/static/bundles/
        additional_dependencies:
          - eslint@10.15.0
          - '@eslint/js@10.0.1'
          - globals@17.14.0
          - typescript@6.0.3
          - typescript-eslint@8.73.0

  # GitHub Actions workflows. actionlint checks syntax, expressions and (through shellcheck) run: scripts;
  # zizmor checks for security problems. Ignore a zizmor finding inline with `# zizmor: ignore[<audit>]`
  # and say why in a comment. --offline skips the audits that call the GitHub API, so the hook gives the same
  # result with or without a GH_TOKEN and doesn't hit API rate limits.
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
        additional_dependencies: [shellcheck-py==0.11.0.1]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
        args: [--offline]

# sets up .pre-commit-ci.yaml to ensure pre-commit dependencies stay up to date
ci:
  autoupdate_schedule: weekly
  submodules: false
