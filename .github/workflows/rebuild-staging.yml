name: Rebuild staging branch

# Rebuilds `autostaging` from https://github.com/dimagi/staging-branches/blob/main/commcare-connect-staging.yml
# and deploys it when the code changed. Based on commcare-hq's rebuild-staging.yml.
#
# Runs on:
# - a push to any branch: rebuilds only if the branch is listed (`main` always is).
# - workflow_dispatch: started by staging-branches whenever the list changes.
# A push to `main` that merges a listed branch removes it from the list instead; that edit starts the rebuild.

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: read

env:
  STAGING_CONFIG: commcare-connect-staging.yml

jobs:
  check-branch:
    # Only run on the canonical repo, not on forks or mirrors. Branch deletions are pushes too; skip them.
    if: github.repository == 'dimagi/commcare-connect' && !github.event.deleted
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-rebuild: >-
        ${{ github.event_name == 'workflow_dispatch'
            || (steps.check.outputs.found == 'true' && steps.check-merged.outputs.merged-branch == '') }}
      merged-branch: ${{ steps.check-merged.outputs.merged-branch }}
    steps:
      - name: Check if branch is in staging config
        id: check
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # The contents API isn't cached, unlike raw.githubusercontent.com, so a just-added branch is seen
          gh api "repos/dimagi/staging-branches/contents/$STAGING_CONFIG" \
            -H 'Accept: application/vnd.github.raw' > staging.yml
          # Exact match on active entries; comments and substrings don't count
          if yq -e '.branches[] | select(. == strenv(BRANCH))' staging.yml > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "Branch '$BRANCH' not in staging config, skipping rebuild"
          fi

      - name: Check if push to main merged a staging branch
        id: check-merged
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # Works for merge, squash and rebase merges, unlike parsing the commit message.
          # Fork PRs are skipped: their config entries are `owner:branch`, which the removal can't match.
          MERGED_BRANCH=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq "
            [.[] | select(.merged_at != null
                          and .base.ref == \"main\"
                          and .head.repo.full_name == \"$GITHUB_REPOSITORY\")][0].head.ref // empty")
          if [ -z "$MERGED_BRANCH" ]; then
            echo "No merged pull request found for $SHA"
            exit 0
          fi
          echo "Detected merged branch: $MERGED_BRANCH"
          if BRANCH="$MERGED_BRANCH" yq -e '.branches[] | select(. == strenv(BRANCH))' staging.yml > /dev/null; then
            echo "merged-branch=$MERGED_BRANCH" >> "$GITHUB_OUTPUT"
            echo "Branch '$MERGED_BRANCH' is in the staging config, will trigger removal"
          else
            echo "Merged branch '$MERGED_BRANCH' not in staging config"
          fi

  remove-merged-branch:
    needs: check-branch
    if: needs.check-branch.outputs.merged-branch != ''
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.STAGING_BRANCHES_APP_ID }}
          private-key: ${{ secrets.STAGING_BRANCHES_APP_PRIVATE_KEY }}
          owner: dimagi
          repositories: staging-branches

      - name: Trigger branch removal
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ needs.check-branch.outputs.merged-branch }}
        run: |
          echo "Triggering removal of branch '$BRANCH' from $STAGING_CONFIG"
          gh workflow run remove-connect-branch.yml \
            --repo dimagi/staging-branches \
            -f branch="$BRANCH" \
            -f reason=merge

  rebuild-staging:
    needs: check-branch
    if: needs.check-branch.outputs.should-rebuild == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # On the job, not the workflow, so pushes to unlisted branches never queue here and can't replace
    # a waiting rebuild. A replaced waiting rebuild is harmless: the newer one builds the latest state.
    concurrency:
      group: rebuild-staging
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Full history needed for merging branches
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install git-build-branch
        run: uv tool install git-build-branch==0.1.20

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Build autostaging
        id: build
        run: |
          set -o pipefail
          ./deploy/rebuildstaging --no-push 2>&1 | tee build.log

      - name: Install app dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils gdal-bin libproj-dev
          # git-build-branch leaves the original branch checked out
          git checkout autostaging
          uv sync --frozen

      # The checks below catch a broken combination of branches before autostaging is pushed, rather than in
      # the deploy. They need no database service: makemigrations only warns when it can't reach one.
      - name: Run Django checks
        id: django-check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          set -o pipefail
          uv run python manage.py check 2>&1 | tee check.log

      - name: Check migrations
        id: migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          # Two staged branches that each add a migration to the same app give it two leaf nodes
          set -o pipefail
          uv run python manage.py makemigrations --check --dry-run 2>&1 | tee migrations.log

      - name: Push if the code changed
        id: push
        run: |
          # Every build makes new merge commits, so compare trees to avoid deploying identical code
          if git rev-parse -q --verify origin/autostaging > /dev/null \
              && [ "$(git rev-parse 'autostaging^{tree}')" = "$(git rev-parse 'origin/autostaging^{tree}')" ]; then
            echo "autostaging is unchanged, nothing to deploy"
            exit 0
          fi
          git push --force origin autostaging
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # A push made with GITHUB_TOKEN doesn't start deploy.yml, so start it explicitly
        run: gh workflow run deploy.yml --ref main -f environment=staging -f deploy_type=adhoc

      - name: Build Slack message
        id: slack-message
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_STEP: >-
            ${{ steps.build.outcome == 'failure' && 'build'
                || steps.django-check.outcome == 'failure' && 'check'
                || steps.migrations.outcome == 'failure' && 'migrations'
                || 'other' }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          # Run main's copy of the report, not one a staged branch may have changed, since it gets the Slack token
          git checkout --quiet --force main
          case "$FAILED_STEP" in
            build) LOG=build.log ;;
            check) LOG=check.log ;;
            migrations) LOG=migrations.log ;;
            *) LOG="" ;;
          esac
          if ! uv run --no-project --with httpx --with pyyaml python -m deploy.staging_report \
              --step "$FAILED_STEP" ${LOG:+--log "$LOG"} --config "artifacts/staging-branches/$STAGING_CONFIG" \
              --run-url "$RUN_URL" --output slack-payload.json; then
            # Still report the failure, without the details, if the report itself breaks
            jq -n --arg url "$RUN_URL" '{text: "Staging rebuild failed", blocks: [{type: "section", text: {
              type: "mrkdwn", text: ("*Staging rebuild failed.* <" + $url + "|View run>")}}]}' > slack-payload.json
          fi

      - name: Post failure to Slack
        if: failure() && steps.slack-message.outcome == 'success'
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: 'C09TVKX4N2C'
          payload-file-path: ./slack-payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
