# Claude Dependabot PR Review Workflow
#
# Runs the `dependabot-pr-review` skill against a Dependabot PR and posts the
# resulting review as a PR comment.
#
# The review instructions are NOT duplicated here. They live in
# `.claude/skills/dependabot-pr-review/`, which is the same skill a developer
# invokes locally with `/dependabot-pr-review <N>`. This workflow only supplies
# the CI-specific overrides (which PR, post the comment, non-interactive). Keep
# it that way: when the prompt was inlined here it drifted from reality and sat
# for months telling Claude to parse a pnpm lockfile this repo does not have.
#
# Triggered on: Dependabot PRs (opened, synchronize), or manual dispatch
#
# Requirements:
# - `.claude/skills/dependabot-pr-review/` must be committed to the repo.
# - ANTHROPIC_API_KEY must exist in BOTH secret stores, under the same name:
#     Settings > Secrets and variables > Actions      (workflow_dispatch runs)
#     Settings > Secrets and variables > Dependabot   (Dependabot-triggered runs)
#   A run triggered by Dependabot reads only the Dependabot store, so a key
#   present in just the Actions store yields an empty value and the step fails.
#   No PAT is required: Dependabot runs start with a read-only GITHUB_TOKEN,
#   but the `permissions:` block below raises it, which is GitHub's documented
#   way to grant write access for these events.
#
# Notes:
# - No concurrency group is set, so runs are independent of one another.

name: Claude Dependabot PR Review

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to analyze'
        required: true
        type: string

jobs:
  dependabot-review:
    # Gate on who authored the PR, not github.actor -- the actor is whoever
    # triggered this event, which is not necessarily the PR's author. The
    # event_name guard matters because github.event.pull_request is null on
    # workflow_dispatch.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == 'dependabot[bot]') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      pull-requests: write
      issues: read
      # Deliberately no `id-token: write`. This job never authenticates to a
      # cloud provider, and the repo's deploy workflow assumes an AWS role via
      # OIDC -- so minting an OIDC token here would hand any code that runs in
      # this job a path to those deploy credentials.
      # Gates the github_ci MCP server, which replaces shelling out to
      # `gh pr checks` / `gh run view` / `gh api .../jobs/<id>/logs`.
      actions: read

    # Mirrors the repo's own pytest job (.github/workflows/ci.yml) so the review
    # can actually run the suite against the PR's dependencies rather than only
    # reasoning about them. Reading changelogs finds far less than running tests.
    services:
      redis:
        image: redis:6
        ports:
          - 6379:6379
      postgres:
        image: postgis/postgis:15-3.5
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres

    env:
      CELERY_BROKER_URL: 'redis://localhost:6379/0'
      REDIS_URL: 'redis://localhost:6379/0'
      DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/postgres'

    steps:
      # Audit only: records egress without blocking. Flip to `block` plus an
      # `allowed-endpoints` list once the recorded traffic looks stable.
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Resolve PR ref
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ inputs.pr_number || github.event.pull_request.number }}"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          REF=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName')
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.ref }}
          # This job executes third-party dependency code (installs and tests),
          # so don't leave a credential behind in .git/config for it to read.
          # The repo is public, so the unauthenticated fetches lockdiff.py makes
          # still work.
          persist-credentials: false
          # Full history, all branches. The skill compares the PR against
          # origin/main to detect PRs whose dependency was removed or whose
          # target version main has already passed, and lockdiff.py needs a
          # real merge-base. A shallow clone silently breaks both.
          fetch-depth: 0

      - name: Verify the skill is present
        run: |
          SKILL=.claude/skills/dependabot-pr-review/SKILL.md
          if [ ! -f "$SKILL" ]; then
            echo "::error::$SKILL not found. The review instructions live in the"
            echo "::error::skill directory and must be committed for this workflow to run."
            exit 1
          fi
          echo "Found $SKILL ($(wc -l < "$SKILL") lines)"

      # PostGIS bindings are needed throughout this repo, tests included.
      - name: Install geo dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils gdal-bin libproj-dev

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # The bundled scripts need 3.11+ for tomllib.
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Installs the PR's *new* versions, so the review can run the suite or
      # diff an installed package rather than only reading changelogs.
      - name: Install Python dependencies
        run: |
          uv venv
          uv sync --locked --dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'

      # This repo uses npm (package-lock.json). Guarded so the step is a no-op
      # if that ever changes, rather than failing every run the way the old
      # unconditional `pnpm install --frozen-lockfile` did.
      # --ignore-scripts: a Dependabot PR's whole content is new dependency
      # versions, and lifecycle scripts would run that code before anyone has
      # reviewed it. Nothing here needs a build step from a transitive package.
      - name: Install Node dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci --ignore-scripts

      - name: Run Claude Dependabot Analysis
        id: claude_review
        env:
          # The review runs almost entirely through `gh` -- reading the PR, its
          # checks, its diff, and posting the comment -- and so do the bundled
          # scripts. Without GH_TOKEN on *this* step every one of those calls
          # fails with "set the GH_TOKEN environment variable". Setting it on
          # the earlier step does not carry over.
          #
          # A Dependabot-triggered run gets a read-only GITHUB_TOKEN by
          # default, but the `permissions:` block above raises it -- that is
          # GitHub's documented mechanism, so no PAT is needed to comment.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Makes a bare `gh pr view <N>` resolve to this repo even if an
          # explicit --repo is ever missed.
          GH_REPO: ${{ github.repository }}
        uses: anthropics/claude-code-action@v1.0.206
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: 'dependabot[bot]'
          # Unlocks the github_ci MCP tools listed in --allowedTools below.
          additional_permissions: |
            actions: read
          # Deliberately not `Bash(gh:*)`. The only write-capable GitHub command
          # granted is `gh pr comment`; everything else is read-only or local.
          # CI status and job logs come from the github_ci MCP server rather
          # than the CLI, which is narrower and more reliable than parsing
          # `gh run view` output.
          claude_args: |
            --allowedTools "mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(git:*),Bash(python:*),Bash(python3:*),Bash(uv:*),Bash(npm:*),Bash(node:*),Bash(pytest:*),Bash(curl:*),Bash(diff:*),Bash(base64:*),Bash(unzip:*),Bash(tar:*),Bash(grep:*),Bash(sed:*),Bash(awk:*),Bash(sort:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(cat:*),Bash(mkdir:*),Read,Write,Glob,Grep,WebFetch,WebSearch"
          prompt: |
            Review pull request #${{ steps.pr.outputs.pr_number }} on ${{ github.repository }}.

            Read `.claude/skills/dependabot-pr-review/SKILL.md` and follow it. It is the
            full review procedure — the classification and triage step, the validity and
            CI checks, the bundled scripts, the research ordering, and the output format.
            Follow it rather than improvising, including the parts that tell you to settle
            a question empirically instead of relaying a changelog claim.

            CI-specific overrides to the skill's defaults:

            1. The PR number is ${{ steps.pr.outputs.pr_number }} and the repo is
               ${{ github.repository }}. Substitute that repo everywhere the skill's
               commands say `dimagi/commcare-connect`, and pass `--repo ${{ github.repository }}`
               to the bundled scripts. Do not ask which PR to review; you have it.

            2. Where the skill writes `<skill-dir>`, it means
               `.claude/skills/dependabot-pr-review` — it is checked out here, and the
               repo root is your working directory. For a grouped bump, inventory it with:
                 python .claude/skills/dependabot-pr-review/scripts/lockdiff.py ${{ steps.pr.outputs.pr_number }} --repo ${{ github.repository }}
               Skip it for a single-package PR, where the diff is already readable.
               Ignore the skill's references to `scripts/triage.py`: that tool scans the
               whole open queue and this run reviews one PR.

            3. For the skill's CI checks, use the github_ci MCP tools rather than the
               `gh` commands it suggests — `mcp__github_ci__get_ci_status` for check
               results, then `mcp__github_ci__get_workflow_run_details` and
               `mcp__github_ci__download_job_log` to read a failing job. `gh pr checks`,
               `gh run view` and `gh api` are not available to you here.

            4. The skill says to print the review to the terminal and not to comment.
               Here, do the opposite: this run exists to post it. Write the review to
               /tmp/review.md, then post it:
                 gh pr comment ${{ steps.pr.outputs.pr_number }} --repo ${{ github.repository }} --body-file /tmp/review.md
               Post exactly once, at the end. If you cannot post, print the review to the
               log so the run is still useful.

            5. End the comment with this line so readers know what produced it:
               `<sub>Automated review via the dependabot-pr-review skill — please sanity-check before acting.</sub>`

            6. You are non-interactive. Where the skill says to ask the user, choose the
               most reasonable option, state the assumption in the review, and continue.

            7. Write scratch files under /tmp. Do not modify anything in the working tree,
               and do not push, merge, or close anything. The only write to GitHub you may
               make is the single PR comment above.

            8. `uv sync --locked --dev` has already run against this PR's lockfile, so the
               PR's new versions are installed in .venv — use that for artifact diffing
               and for running the suite, rather than reinstalling. Node deps are
               installed too when the repo has a package-lock.json.

            9. Postgres (PostGIS) and Redis are running as service containers, and
               DATABASE_URL / REDIS_URL are already set, so `uv run pytest` works. Running
               the suite is usually the fastest way to turn a suspected breakage into a
               confirmed one — prefer it over reasoning about changelogs. If it is too
               slow for the whole suite, run the modules your impact analysis implicates.
