name: Deploy
run-name: Deploy to ${{ inputs.environment || 'staging' }} (${{ inputs.deploy_type || 'push' }})

env:
  SENTRY_ORG: 'dimagi'
  SENTRY_PROJECT: 'commcare-connect'

permissions:
  id-token: write
  contents: write

on:
  push:
    branches: [autostaging]
  #  workflow_run:
  #    workflows: [CI]
  #    types: [completed]
  #    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      deploy_type:
        description: 'Whether this deploy is part of the regular schedule or an adhoc/hotfix deploy'
        required: true
        default: 'scheduled'
        type: choice
        options:
          - scheduled
          - adhoc
  # Called by scheduled-deploy.yml
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      deploy_type:
        required: true
        type: string
      ref:
        description: 'Commit to deploy instead of the deploy branch head (callers holding the deploy group only)'
        required: false
        type: string

# One deploy per environment at a time; later runs wait rather than cancel a deploy in progress.
# scheduled-deploy.yml holds deploy-production for its whole run and passes ref. Asking for the same group again here
# would make GitHub cancel the run as a deadlock, so a call with ref gets a group of its own. Pass ref only while
# holding the deploy group, or that deploy runs unguarded. Keep cancel-in-progress: false here and in
# scheduled-deploy.yml, or one could cancel the other's deploy halfway.
concurrency:
  group: >-
    ${{ inputs.ref && format('deploy-called-{0}', github.run_id)
    || format('deploy-{0}', inputs.environment || 'staging') }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ inputs.environment || 'staging' }}
      # Staging always deploys autostaging and production always deploys main, whichever branch triggered the run
      DEPLOY_BRANCH: ${{ (inputs.environment || 'staging') == 'production' && 'main' || 'autostaging' }}
    outputs:
      slack_ts: ${{ steps.slack.outputs.ts }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || env.DEPLOY_BRANCH }}

      - name: Set release identifier
        run: |
          # Sentry release versions cannot contain slashes, so sanitize the ref name
          SAFE_REF_NAME="${DEPLOY_BRANCH//\//-}"
          DEPLOY_SHA="$(git rev-parse HEAD)"
          echo "DEPLOY_SHA=${DEPLOY_SHA}" >> "$GITHUB_ENV"
          echo "APP_RELEASE=${SAFE_REF_NAME}.${DEPLOY_SHA}" >> "$GITHUB_ENV"

      - name: Set up Ruby
        uses: actions/setup-ruby@v1

      - name: Install Kamal
        run: gem install kamal -v '~> 1.9.2'

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2.5.1
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          config: |
            Host *
              StrictHostKeyChecking no
              UserKnownHostsFile=/dev/null

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v3.0.1
        with:
          role-to-assume: arn:aws:iam::037129986032:role/github_deploy
          role-session-name: GithubDeploy
          aws-region: ${{ env.DEPLOY_ENV == 'production' && 'eu-west-1' || 'us-east-1' }}

      - id: slack
        name: Notify Deploy Start
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: ${{ env.DEPLOY_ENV == 'production' && vars.SLACK_PRODUCTION_DEPLOY_CHANNEL || vars.SLACK_STAGING_DEPLOY_CHANNEL }}
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*CommCare Connect Deploy to ${{ env.DEPLOY_ENV }}* (${{ inputs.deploy_type || 'push' }})"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*Status*: In Progress"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                      {
                          "type": "mrkdwn",
                          "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Deploy Run>"
                      }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN}}

      - id: deploy
        working-directory: ./deploy
        run: 'kamal deploy -d ${{ env.DEPLOY_ENV }}'

      # The GitHub release is the record of what production runs, which the scheduled deploy's readiness check uses.
      # Keep these two steps straight after kamal deploy, so a later step failing can't leave production ahead of it.
      - name: Set release tag
        if: ${{ success() && env.DEPLOY_ENV == 'production' }}
        run: echo "RELEASE_TAG=$(date -u +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_ENV"

      - name: Create GitHub release
        if: ${{ success() && env.DEPLOY_ENV == 'production' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.DEPLOY_SHA }}
          generate_release_notes: true

      - name: Create Sentry release
        if: ${{ success() }}
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          environment: ${{ env.DEPLOY_ENV }}
          release: ${{ env.APP_RELEASE }}
          projects: ${{ env.SENTRY_PROJECT }}
          set_commits: manual
          repo: dimagi/commcare-connect
          commit: ${{ env.DEPLOY_SHA }}

      - name: Notify Deploy End
        uses: slackapi/slack-github-action@v1.24.0
        if: always()
        with:
          channel-id: ${{ env.DEPLOY_ENV == 'production' && vars.SLACK_PRODUCTION_DEPLOY_CHANNEL || vars.SLACK_STAGING_DEPLOY_CHANNEL }}
          update-ts: ${{ steps.slack.outputs.ts }}
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*CommCare Connect Deploy to ${{ env.DEPLOY_ENV }}* (${{ inputs.deploy_type || 'push' }})"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*Status*: ${{ steps.deploy.conclusion }}"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                      {
                          "type": "mrkdwn",
                          "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Deploy Run>"
                      }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN}}

  running-qa-test:
    name: Trigger QA Playwright suite
    needs: deploy
    if: ${{ success() && inputs.environment == 'production' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Wait for the deploy to be serving
        run: |
          url=https://connect.dimagi.com
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "$url" && exit 0
            sleep 10
          done
          echo "site not responding after 5m" >&2; exit 1

      - name: Dispatch playwright_web.yaml
        env:
          GH_TOKEN: ${{ secrets.QA_SUITE_DISPATCH_TOKEN }}
        run: |
          gh workflow run playwright_web.yaml \
            --repo dimagi/dimagi-qa-ccc \
            --ref main \
            -f environment=prod \
            -f source=post-deploy

      - name: Notify QA trigger failure
        if: ${{ failure() }}
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: ${{ vars.SLACK_PRODUCTION_DEPLOY_CHANNEL }}
          payload: |
            {
              "thread_ts": "${{ needs.deploy.outputs.slack_ts }}",
              "text": ":warning: Deploy succeeded, but triggering the QA Playwright suite failed. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Deploy Run>"
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN}}
