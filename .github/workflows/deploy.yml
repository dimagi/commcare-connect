name: Deploy
run-name: Deploy to ${{ inputs.environment || 'staging' }} (${{ inputs.deploy_type || 'push' }})

env:
  SENTRY_ORG: 'dimagi'
  SENTRY_PROJECT: 'commcare-connect'

permissions:
  id-token: write
  contents: write
  deployments: write

on:
  push:
    branches: [autostaging]
  #  workflow_run:
  #    workflows: [CI]
  #    types: [completed]
  #    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      deploy_type:
        description: 'Whether this deploy is part of the regular schedule or an adhoc/hotfix deploy'
        required: true
        default: 'scheduled'
        type: choice
        options:
          - scheduled
          - adhoc

# One deploy per environment at a time; later runs wait rather than cancel a deploy in progress
concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ inputs.environment || 'staging' }}
      # Staging always deploys autostaging and production always deploys main, whichever branch triggered the run
      DEPLOY_BRANCH: ${{ (inputs.environment || 'staging') == 'production' && 'main' || 'autostaging' }}
      DEPLOY_URL: ${{ (inputs.environment || 'staging') == 'production' && 'https://connect.dimagi.com' || 'https://connect-staging.dimagi.com' }}
      LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    outputs:
      slack_ts: ${{ steps.slack.outputs.ts }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Set release identifier
        run: |
          # Sentry release versions cannot contain slashes, so sanitize the ref name
          SAFE_REF_NAME="${DEPLOY_BRANCH//\//-}"
          DEPLOY_SHA="$(git rev-parse HEAD)"
          echo "DEPLOY_SHA=${DEPLOY_SHA}" >> "$GITHUB_ENV"
          echo "APP_RELEASE=${SAFE_REF_NAME}.${DEPLOY_SHA}" >> "$GITHUB_ENV"

      # Record the deploy in GitHub's Deployments API so each environment shows what is running there.
      # Created explicitly (not via the job-level `environment:` key) so the record points at the SHA
      # actually deployed rather than the ref that triggered the workflow. Bookkeeping only: a failure
      # here must not block the deploy.
      - id: gh_deployment
        name: Create GitHub deployment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_TYPE: ${{ inputs.deploy_type || 'push' }}
        run: |
          # required_contexts=[] skips GitHub's commit-status check; CI gating is the deploy process's job
          DEPLOYMENT_ID="$(jq -n \
            --arg ref "${DEPLOY_SHA}" \
            --arg environment "${DEPLOY_ENV}" \
            --arg description "${DEPLOY_TYPE} deploy of ${DEPLOY_BRANCH}" \
            --argjson production "${{ env.DEPLOY_ENV == 'production' }}" \
            '{ref: $ref, environment: $environment, description: $description, auto_merge: false,
              required_contexts: [], production_environment: $production}' \
            | gh api "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq '.id')"
          echo "id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state=in_progress \
            -f log_url="${LOG_URL}" \
            -f environment_url="${DEPLOY_URL}" > /dev/null

      - name: Set up Ruby
        uses: actions/setup-ruby@v1

      - name: Install Kamal
        run: gem install kamal -v '~> 1.9.2'

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2.5.1
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          config: |
            Host *
              StrictHostKeyChecking no
              UserKnownHostsFile=/dev/null

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v3.0.1
        with:
          role-to-assume: arn:aws:iam::037129986032:role/github_deploy
          role-session-name: GithubDeploy
          aws-region: ${{ env.DEPLOY_ENV == 'production' && 'eu-west-1' || 'us-east-1' }}

      - id: slack
        name: Notify Deploy Start
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: ${{ env.DEPLOY_ENV == 'production' && 'C09HWCJSVJ6' || 'C09TVKX4N2C' }}
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*CommCare Connect Deploy to ${{ env.DEPLOY_ENV }}*"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*Status*: In Progress"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                      {
                          "type": "mrkdwn",
                          "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Deploy Run>"
                      }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN}}

      - id: deploy
        working-directory: ./deploy
        run: 'kamal deploy -d ${{ env.DEPLOY_ENV }}'

      - name: Create Sentry release
        if: ${{ success() }}
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          environment: ${{ env.DEPLOY_ENV }}
          release: ${{ env.APP_RELEASE }}
          projects: ${{ env.SENTRY_PROJECT }}
          set_commits: manual
          repo: dimagi/commcare-connect
          commit: ${{ env.DEPLOY_SHA }}

      - name: Set release tag
        if: ${{ success() && env.DEPLOY_ENV == 'production' }}
        run: echo "RELEASE_TAG=$(date -u +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_ENV"

      - name: Create GitHub release
        if: ${{ success() && env.DEPLOY_ENV == 'production' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.DEPLOY_SHA }}
          generate_release_notes: true

      - name: Update GitHub deployment status
        if: ${{ always() && steps.gh_deployment.outputs.id }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.gh_deployment.outputs.id }}
          # success → success; failure → failure; cancelled or skipped (an earlier step failed) → error
          DEPLOY_STATE: ${{ steps.deploy.conclusion == 'success' && 'success' || steps.deploy.conclusion == 'failure' && 'failure' || 'error' }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="${DEPLOY_STATE}" \
            -f log_url="${LOG_URL}" \
            -f environment_url="${DEPLOY_URL}" \
            -F auto_inactive=true > /dev/null

      - name: Notify Deploy End
        uses: slackapi/slack-github-action@v1.24.0
        if: always()
        with:
          channel-id: ${{ env.DEPLOY_ENV == 'production' && 'C09HWCJSVJ6' || 'C09TVKX4N2C' }}
          update-ts: ${{ steps.slack.outputs.ts }}
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*CommCare Connect Deploy to ${{ env.DEPLOY_ENV }}*"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*Status*: ${{ steps.deploy.conclusion }}"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                      {
                          "type": "mrkdwn",
                          "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Deploy Run>"
                      }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN}}

  running-qa-test:
    name: Trigger QA Playwright suite
    needs: deploy
    if: ${{ success() && inputs.environment == 'production' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Wait for the deploy to be serving
        run: |
          url=https://connect.dimagi.com
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "$url" && exit 0
            sleep 10
          done
          echo "site not responding after 5m" >&2; exit 1

      - name: Dispatch playwright_web.yaml
        env:
          GH_TOKEN: ${{ secrets.QA_SUITE_DISPATCH_TOKEN }}
        run: |
          gh workflow run playwright_web.yaml \
            --repo dimagi/dimagi-qa-ccc \
            --ref main \
            -f environment=prod \
            -f source=post-deploy

      - name: Notify QA trigger failure
        if: ${{ failure() }}
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: 'C09HWCJSVJ6'
          payload: |
            {
              "thread_ts": "${{ needs.deploy.outputs.slack_ts }}",
              "text": ":warning: Deploy succeeded, but triggering the QA Playwright suite failed. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Deploy Run>"
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN}}
