name: Docs

# Builds the developer docs site (zensical.toml) on every PR that could change it, so broken links and
# missing snippet files fail review, and publishes it to GitHub Pages from main.
# Publishing needs Settings > Pages > Source set to "GitHub Actions" on the repository.

on:
  pull_request:
    branches: ['main']
    paths:
      - 'docs/**'
      - '**/*.md'
      - 'zensical.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  push:
    branches: ['main']
    paths:
      - 'docs/**'
      - '**/*.md'
      - 'zensical.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Only the docs group: the site needs none of the app's dependencies.
      - name: Install docs dependencies
        run: uv sync --frozen --only-group docs

      # --strict aborts on any warning, so broken links and anchors fail this step.
      - name: Build site
        run: uv run --no-sync zensical build --clean --strict

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
