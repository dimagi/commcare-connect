name: Docs

# Builds the developer docs site (zensical.toml) on every PR that could change it, so broken links and
# missing snippet files fail review, and publishes it to GitHub Pages from main.
# Publishing needs Settings > Pages > Source set to "GitHub Actions" on the repository.

on:
  pull_request:
    branches: ['main']
    paths:
      - 'docs/**'
      - '**/*.md'
      - 'zensical.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  push:
    branches: ['main']
    paths:
      - 'docs/**'
      - '**/*.md'
      - 'zensical.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# One group per PR and one for main. PR runs cancel each other; main runs queue instead, so a Pages
# deploy is never cut off halfway and an older run can't finish after a newer one.
concurrency:
  group: docs-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Only the docs group: the site needs none of the app's dependencies.
      - name: Install docs dependencies
        run: uv sync --frozen --only-group docs

      # --strict aborts on any warning, so broken links and anchors fail this step.
      - name: Build site
        run: uv run --no-sync zensical build --clean --strict

      # Only main publishes: a manual run from another branch builds but doesn't deploy.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
