# Config for Dependabot updates. See documentation here:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies (uv reads pyproject.toml + uv.lock)
  - package-ecosystem: uv
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 5
    # Wait a week after a release before proposing it, so a compromised or broken release is likely pulled
    # first. Security updates ignore this.
    cooldown:
      default-days: 7
    labels:
      - dependencies
    # Group all minor/patch bumps into one PR to cut noise; major bumps get
    # individual PRs so each breaking change can be assessed on its own.
    groups:
      python-non-major:
        update-types:
          - minor
          - patch
    # Internal Dimagi git-sourced packages have no PyPI versions to track.
    ignore:
      - dependency-name: xml2json
      - dependency-name: git-build-branch

  # Frontend dependencies
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 5
    # Wait a week after a release before proposing it, so a compromised or broken release is likely pulled
    # first. Security updates ignore this.
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      # Babel's core and presets peer on each other's major version, so bumping one alone breaks
      # `npm ci`. Listed first so every @babel/* update, major included, lands in this group.
      babel:
        patterns:
          - '@babel/*'
      npm-non-major:
        update-types:
          - minor
          - patch

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release before proposing it, so a compromised or broken release is likely pulled
    # first. Security updates ignore this.
    cooldown:
      default-days: 7
    labels:
      - dependencies
