[project]
name = "commcare-connect"
version = "0.0.1"
requires-python = "==3.11.*"
dependencies = [
    "argon2-cffi>=21.3.0",
    "celery>=5.3.4",
    "crispy-tailwind>=1.0.3",
    "django>=5.2,<5.3",
    "django-allauth>=65.19.4",
    "django-celery-beat>=2.5.0",
    "django-cors-headers>=4.2.0",
    "django-crispy-forms>=2.7",
    "django-environ>=0.14.0",
    "django-filter>=24.3",
    "django-htmx>=1.29.0",
    "django-oauth-toolkit>=3.4.1",
    "django-pghistory>=3.9.1",
    "django-redis>=7.0.0",
    "django-tables2>=3.0.1",
    "django-vectortiles>=1.0.2",
    "django-waffle>=5.0.0",
    "django-weasyprint>=2.4.0",
    "djangorestframework>=3.18.1",
    "drf-spectacular>=0.30.0",
    "flatten-dict>=0.4.2",
    "geopy>=2.5.0",
    "gevent>=26.9.0",
    "hiredis>=3.4.1",
    "httpx[http2]>=0.24.1",
    "jsonpath-ng>=1.5.3",
    "pillow>=12.3.0",
    "pyproj>=3.7.2",
    "python-slugify>=8.0.1",
    "quickcache>=0.5.4",
    "redis>=8.0.0",
    "sentry-sdk>=2.69.2",
    "shapely>=2.1.2",
    "tablib[xlsx]>=3.5.0",
    "twilio>=9.11.1",
    "whitenoise>=6.5.0",
]

# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--ds=config.settings.test --reuse-db"
python_files = [
    "tests.py",
    "test_*.py",
]
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}"]
# Only unactionable noise belongs here. Naive-datetime RuntimeWarnings and
# RemovedInDjango60Warnings are left visible on purpose - they are real work.
filterwarnings = [
    # WhiteNoise, once per request, because collectstatic has not run locally.
    "ignore:No directory at:UserWarning",
    # allauth importing its own deprecated module.
    "ignore:allauth.exceptions is deprecated:UserWarning",
]

# ==== Coverage ====
[tool.coverage.run]
include = ["commcare_connect/**"]
omit = ["*/migrations/*", "*/tests/*"]


# ==== ruff ====
[tool.ruff]
line-length = 119
target-version = "py311"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes (flake8 defaults), I: isort
select = ["E", "F", "W", "I", "UP", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# Marketing page titles and meta descriptions: prose that has to stay on one
# line to be readable and greppable against the rendered <head>.
"commcare_connect/prelogin/route_meta.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["commcare_connect", "config"]


[tool.uv.sources]
xml2json = { git = "https://github.com/dimagi/xml2json", rev = "041b1ef" }
git-build-branch = { git = "https://github.com/dimagi/git-build-branch" }

[dependency-groups]
dev = [
    "coverage>=7.16.1",
    "django-debug-toolbar>=4.1.0",
    "djlint>=1.46.1",
    "factory-boy>=3.3.0",
    "git-build-branch",
    "invoke>=2.2.0",
    "ipdb>=0.13.13",
    "prek>=0.5.3",
    "psycopg2-binary>=2.9.13",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-httpx>=0.24.0",
    "ruff>=0.16.8",
    "xml2json",
]
production = [
    "django-allow-cidr>=0.7.1",
    "django-anymail[amazon-ses]>=10.1",
    "django-storages[boto3]>=1.13.2",
    "gunicorn[gevent]>=21.2.0",
    "psycopg2>=2.9.13",
]

# ==== djlint ====
[tool.djlint]
profile = "django"
indent = 2
ignore = "H006,H016,H020,H021,H023,H030,H031,T002,T003"
