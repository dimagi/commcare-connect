# worktrunk (https://worktrunk.dev) project hooks. See "Working in git worktrees" in README.md.

[pre-start]
setup = "scripts/setup-worktree.sh"

[post-start]
build-js = "npm run dev"

[post-remove]
cleanup = "uv run python scripts/worktree.py teardown {{ branch }}"

[aliases]
# `wt new <branch> --share=1` creates a worktree that uses the main checkout's database and Redis database.
new = "WORKTREE_SHARE={{ share | default('0') }} wt switch --create {{ args }}"
