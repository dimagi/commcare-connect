[defaults]
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ~/.ansiblecache
fact_caching_timeout = 21600

timeout = 30
forks = 50

[ssh_connection]
# Keep connections open so a second run within 5 minutes doesn't ask 1Password to sign again.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=5m
pipelining = True
