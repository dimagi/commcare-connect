logging:
  options:
    awslogs-region: 'eu-west-1'

traefik:
  options:
    log-driver: awslogs
    log-opt:
      - awslogs-region=eu-west-1
      - awslogs-group=commcare-connect-traefik

servers:
  web:
    hosts:
      - i-0061917b7240cfaef
      - i-0006273d9b40ce3e0
      - i-028041b238ae4e183
    options:
      # create by ansible
      env-file: '/home/connect/www/commcare-connect/docker.env'
    logging:
      options:
        awslogs-group: 'commcare-connect-web'
        tag: 'web-{{.ID}}'
    labels:
      traefik.http.middlewares.commcare-compress.compress: true
      traefik.http.routers.commcare-connect-web-production.middlewares: commcare-connect-web-production-retry@docker,commcare-compress

  celery:
    hosts:
      - i-0517c5593d6eb861e
    options:
      # create by ansible
      env-file: '/home/connect/www/commcare-connect/docker.env'
    cmd: /start_celery
    env:
      clear:
        CELERY_WORKER_BEAT: 'true'
    labels:
      traefik.enable: false
    logging:
      options:
        awslogs-group: 'commcare-connect-celery'
        tag: 'celery-{{.ID}}'

  celery-workers:
    hosts:
      - i-0abc62500bf452840
    options:
      # create by ansible
      env-file: '/home/connect/www/commcare-connect/docker.env'
    cmd: /start_celery
    labels:
      traefik.enable: false
    logging:
      options:
        awslogs-group: 'commcare-connect-celery'
        tag: 'celery-{{.ID}}'
